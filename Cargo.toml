[package]
name = "aerial-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aerial screensaver for Linux and COSMIC, implemented in Rust"
repository = "https://github.com/justinbukoski/aerial-linux"
readme = "README.md"
keywords = ["screensaver", "wayland", "cosmic", "aerial", "video"]
categories = ["multimedia::video", "command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
plist = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
